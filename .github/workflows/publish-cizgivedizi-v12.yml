name: Publish CizgiVeDizi v12

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-cizgivedizi-v12.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntpritalynorth.oaiusercontent.com/files/00000000-f648-8246-8e10-1933b142d2bb/raw?se=2026-09-24T22%3A37%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=0f46cdca-da03-54b1-9fa3-e48e7b2076ea&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T20%3A44%3A20Z&ske=2026-09-25T20%3A44%3A20Z&sks=b&skv=2026-02-06&sig=HbPe1TiNgfYOws1x5ABw0t2gSCJAzSGrtK8wPo5mOlA%3D"
      EXPECTED_VERSION: "12"
      EXPECTED_SIZE: "34773"
      EXPECTED_SHA256: "043f08ac6ce85aea564d839f6aba13e8ba84e60781aa6e5790ef3cd519f67acc"
      SOURCE_REV: "1f380ebfcded3afae874b575d8756715221222f4"
    steps:
      - name: Download and verify artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage"
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o "$RUNNER_TEMP/transfer.zip"
          unzip -q "$RUNNER_TEMP/transfer.zip" -d "$RUNNER_TEMP/stage"
          python - "$RUNNER_TEMP/stage/CizgiVeDizi.cs3" "$EXPECTED_VERSION" "$EXPECTED_SIZE" "$EXPECTED_SHA256" <<'PY'
          import hashlib,json,sys,zipfile
          from pathlib import Path
          p=Path(sys.argv[1]); ver=int(sys.argv[2]); size=int(sys.argv[3]); sha=sys.argv[4]
          data=p.read_bytes()
          assert len(data)==size
          assert hashlib.sha256(data).hexdigest()==sha
          with zipfile.ZipFile(p) as z:
              m=json.loads(z.read("manifest.json").decode("utf-8"))
          assert m.get("name")=="CizgiVeDizi"
          assert m.get("version")==ver
          print(f"verified CizgiVeDizi v{ver} | {len(data)} | {sha}")
          PY

      - uses: actions/checkout@v4
        with:
          ref: builds
          path: builds
          fetch-depth: 1

      - name: Publish standalone package
        id: builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "builds/$SOURCE_REV"
          cp "$RUNNER_TEMP/stage/CizgiVeDizi.cs3" "builds/$SOURCE_REV/CizgiVeDizi.cs3"
          cp "$RUNNER_TEMP/stage/CizgiVeDizi.cs3" "builds/CizgiVeDizi.cs3"
          python - builds/plugins.json "$SOURCE_REV" "$EXPECTED_SIZE" "$EXPECTED_SHA256" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); source=sys.argv[2]; size=int(sys.argv[3]); sha=sys.argv[4]
          rows=json.loads(p.read_text(encoding="utf-8"))
          row=next((x for x in rows if x.get("internalName")=="CizgiVeDizi"),None)
          if row is None: raise SystemExit("CizgiVeDizi row missing")
          row["version"]=12
          row["fileSize"]=size
          row["fileHash"]="sha256-"+sha
          row["hash"]=sha
          row["url"]=f"https://raw.githubusercontent.com/Wiojelt/TurkSinema/builds/{source}/CizgiVeDizi.cs3"
          p.write_text(json.dumps(rows,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git -C builds config user.name 'github-actions[bot]'
          git -C builds config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C builds add CizgiVeDizi.cs3 plugins.json "$SOURCE_REV/CizgiVeDizi.cs3"
          git -C builds -c commit.gpgsign=false commit --allow-empty-message -m ""
          git -C builds push origin HEAD:builds
          echo "sha=$(git -C builds rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 1

      - name: Refresh repository catalogue
        env:
          BUILD_SHA: ${{ steps.builds.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - main/repo.json "$BUILD_SHA" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); sha=sys.argv[2]
          d=json.loads(p.read_text(encoding="utf-8"))
          d["pluginLists"]=[f"https://raw.githubusercontent.com/Wiojelt/TurkSinema/builds/plugins.json?v={sha}"]
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git -C main config user.name 'github-actions[bot]'
          git -C main config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C main add repo.json
          if ! git -C main diff --cached --quiet; then
            git -C main -c commit.gpgsign=false commit --allow-empty-message -m ""
            git -C main push origin HEAD:main
          fi
