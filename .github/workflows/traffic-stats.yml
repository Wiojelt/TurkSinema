name: Aggregate traffic stats

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write anonymous aggregate counters
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/traffic"
          views="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${api}/views")"
          clones="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${api}/clones")"
          jq -n --arg updatedAt "$(date -u +%FT%TZ)" --argjson views "$views" --argjson clones "$clones"             '{updatedAt:$updatedAt,views:{count:$views.count,uniques:$views.uniques},clones:{count:$clones.count,uniques:$clones.uniques}}' > stats.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stats.json
          git diff --cached --quiet || git commit --allow-empty-message -m ""
          git push

